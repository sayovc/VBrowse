<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VBrowse</title>
  <meta name="description" content="VBrowse (VibeBrowse): scroll, post, like, comment and follow.">
  <meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%231D4ED8'/><stop offset='1' stop-color='%2360B8FA'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><path d='M10 10.5 16 22l6-11.5' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <script>try { var t = localStorage.getItem('vb.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <header class="topbar">
    <a href="#/" class="logo" aria-label="VBrowse home">
      <span class="brand-mark"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6.5 7 12 17.5 17.5 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="wordmark">VBrowse</span>
    </a>
    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Search" aria-label="Search posts, #tags or @handles" autocomplete="off">
      <button type="submit" aria-label="Search"><i data-ic="search"></i></button>
    </form>
    <div class="top-actions" id="topActions"></div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Main">
    <a href="#/" data-nav="home"><i data-ic="home"></i><span>Home</span></a>
    <a href="#/scroll" data-nav="scroll"><i data-ic="scroll"></i><span>Scroll</span></a>
    <button class="nav-upload" data-action="upload" aria-label="Create a post"><i data-ic="plus"></i><span>Create</span></button>
    <a href="#/following" data-nav="following"><i data-ic="people"></i><span>Following</span></a>
    <a href="#/saved" data-nav="saved"><i data-ic="bookmark"></i><span>Saved</span></a>
    <a href="#/me" data-nav="me"><i data-ic="user"></i><span>You</span></a>
    <div class="sidebar-foot">
      <a href="#/settings/appearance" data-nav="settings"><i data-ic="sliders"></i><span>Settings</span></a>
      <a href="#/rules" data-nav="rules"><i data-ic="book"></i><span>Rules</span></a>
    </div>
  </nav>

  <main id="app" tabindex="-1"></main>
  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="/textfilter.js"></script>
  <script src="/app.js"></script>
</body>
</html>
