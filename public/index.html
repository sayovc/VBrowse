<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VBrowse</title>
  <meta name="theme-color" content="#0b0b10">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff3d6e'/><path d='M12 9l12 7-12 7z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="logo" aria-label="VBrowse home"><span class="logo-mark">▶</span><span>V<b class="logo-accent">Browse</b></span></a>
    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Search posts, #tags, @people" autocomplete="off">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 4a6 6 0 104.47 10.03l4.75 4.75 1.41-1.41-4.75-4.75A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg>
      </button>
    </form>
    <div class="top-actions" id="topActions"></div>
  </header>

  <nav class="sidebar" id="sidebar">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg><span>Home</span></a>
    <a href="#/scroll" data-nav="scroll"><svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 012 2v16a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2zm3 6v8l6-4z"/></svg><span>Scroll</span></a>
    <a href="#/following" data-nav="following"><svg viewBox="0 0 24 24"><path d="M9 12a4 4 0 100-8 4 4 0 000 8zm0 2c-3.3 0-7 1.7-7 4v2h14v-2c0-2.3-3.7-4-7-4zm8-4V7h-2v3h-3v2h3v3h2v-3h3v-2z"/></svg><span>Following</span></a>
    <a href="#/saved" data-nav="saved"><svg viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 011 1v19l-7-4-7 4V3a1 1 0 011-1z"/></svg><span>Saved</span></a>
    <a href="#/me" data-nav="me"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-9 2-9 5v3h18v-3c0-3-5-5-9-5z"/></svg><span>Profile</span></a>
    <button class="nav-upload" data-action="upload"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg><span>Create</span></button>
  </nav>

  <main id="app" tabindex="-1"></main>
  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
